<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.2/plyr.css">
    <script src="https://cdn.plyr.io/3.6.3/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js"></script>
    
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .player-wrapper { width: 100%; max-width: 1000px; }
        video { width: 100%; background: #000; }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video id="player" autoplay controls playsinline crossorigin></video>
    </div>

    <script>
        // Stream URL प्राप्त करने का फंक्शन
        function getParam(name){
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        var stream = getParam("embed");
        const video = document.getElementById("player");

        if (Hls.isSupported()) {
            const hls = new Hls({maxMaxBufferLength:100});
            hls.loadSource(stream);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function(){
                const levels = hls.levels.map(l => l.height);
                // प्लेयर चालू करना
                new Plyr(video, {
                    quality: {
                        default: levels[0],
                        options: levels,
                        forced: true,
                        onChange: (q) => {
                            hls.levels.forEach((level, i) => {
                                if(level.height === q){ hls.currentLevel = i; }
                            });
                        }
                    }
                });
            });
        } else {
            video.src = stream;
            new Plyr(video);
        }
    </script>
</body>
</html>
