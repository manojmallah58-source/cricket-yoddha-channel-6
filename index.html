<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.2/plyr.css">
    <script src="https://cdn.plyr.io/3.6.3/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden; /* Scroll bars ko hatane ke liye */
        }
        .player-wrapper {
            width: 100vw;
            height: 100vh;
        }
        video {
            width: 100%;
            height: 100%;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video id="player" autoplay controls playsinline crossorigin></video>
    </div>

    <script>
        function getParam(name){
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        var stream = getParam("embed");
        const video = document.getElementById("player");

        if (Hls.isSupported()) {
            const hls = new Hls({maxMaxBufferLength:100});
            hls.loadSource(stream);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function(){
                // Plyr ko configure kiya gaya hai full screen support ke sath
                const player = new Plyr(video, {
                    fullscreen: { enabled: true, fallback: true, iosNative: true },
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen']
                });
            });
        } else {
            video.src = stream;
            new Plyr(video);
        }
    </script>
</body>
</html>
